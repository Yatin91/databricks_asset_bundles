resources:
  jobs:
    bakehouse_data_refresh:
      name: bakehouse_data_refresh
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: customer_360
          notebook_task:
            notebook_path: ../src/customer_360.ipynb
          environment_key: default

        - task_key: transaction_summary
          depends_on:
            - task_key: customer_360
          notebook_task:
            notebook_path: ../src/transaction_summary.ipynb
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "1"