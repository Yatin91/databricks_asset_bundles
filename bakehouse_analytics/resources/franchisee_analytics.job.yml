resources:
  jobs:
    franchisee_analytics:
      name: franchisee_analytics
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: franchisee_analytics
          notebook_task:
            notebook_path: ../src/franchisee_analytics/franchisee_analytics.ipynb
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"